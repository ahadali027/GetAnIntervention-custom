<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .outlined-text {
        font-weight: 700;
        -webkit-text-stroke: 0.5px black; /* Creates an outline effect */
        color: white; /* Makes the inner part of the text transparent */
      }
    </style>
  </head>
  <body>
    <span class="outlined-text">WE</span> <b>CAN ORGANIZE EVERYTHING</b>
  </body>
</html>
